# Stack unica: web, wallet, car e site no mesmo compose, com um Mongo, um
# Redis e UM emailer. O car veio do compose proprio (repo car-dev, aposentado)
# em 22/08/2026 -- ele sempre usou o mesmo banco e o mesmo cookie de sessao
# que o web, entao compartilhar a infra e' reconhecer o que ja era.
#
# TITLE, DESCRIPTION e AUTH_TRUST_HOST vem do .env pro `web`; os outros apps
# sobrescrevem em `environment:`. Sao as unicas variaveis que precisam
# divergir -- conferido comparando o env real dos containers, var por var.
services:
  web:
    image: registry.rcaldas.com/rcaldas/web:81f68b2
    restart: unless-stopped
    ports:
      - "8611:3000"
    env_file: .env
    environment:
      - HOSTNAME=0.0.0.0
    networks:
      - default
      - mailu_default
    volumes:
      - /var/rcaldas/live/home:/var/rcaldas/live/home:ro
      - /var/rcaldas/live/bin:/var/rcaldas/live/bin:ro
      - /var/rcaldas/live/upload:/var/rcaldas/live/upload
      - /var/zxnet/.ssh/pending-keys:/var/zxnet/.ssh/pending-keys
    # Ver explicação completa no bloco `wallet` abaixo.
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:514"
        tag: "web"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M
    depends_on:
      - redis
  car:
    image: registry.rcaldas.com/rcaldas/car:3.5
    restart: unless-stopped
    ports:
      - "8612:3000"
    env_file: .env
    environment:
      - AUTH_TRUST_HOST=https://car.rcaldas.com
      - TITLE=Car App
      - DESCRIPTION=Controle de veículos e manutenção automotiva.
    # Ver explicação completa no bloco `wallet` abaixo.
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:514"
        tag: "car"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M
    depends_on:
      - redis
  site:
    image: registry.rcaldas.com/rcaldas/site:10b2e35
    restart: unless-stopped
    ports:
      - "8615:80"   # 8614 ja e' o rcaldas-static
    # Coletado desde 25/08/2026. Volume medido antes de ligar: 138 linhas/h,
    # contra 1.753/h do haproxy -- barato.
    #
    # A ideia e' justamente ver e podar: a primeira amostra ja mostrou 404
    # em /contatos, /fale-conosco e /contato, que ou viram redirect ou sao
    # ruido de scanner.
    #
    # O IP registrado E' o do cliente real desde a imagem 10b2e35: o
    # nginx adota como remote_addr o X-Real-IP que o HAProxy ja apurou
    # (ele troca o src pelo CF-Connecting-IP quando a conexao vem de um IP
    # da Cloudflare, por ACL). Antes disso o log mostrava 172.20.0.1 -- a
    # ponte do Docker -- em toda linha, e dizia O QUE foi pedido sem
    # nunca dizer POR QUEM.
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:514"
        tag: "site"
    deploy:
      resources:
        limits:
          memory: 128M   # nginx servindo arquivo estatico: nao precisa de mais
        reservations:
          memory: 16M
  wallet:
    image: registry.rcaldas.com/rcaldas/wallet:ca8583f
    restart: unless-stopped
    ports:
      - "8613:3000"
    env_file: .env
    # Logs deste servico no coletor central do proprio us (ver
    # /etc/rsyslog.d/05-docker-services.conf) -- ate agora so tinhamos
    # heartbeat de host (CPU/disco/memoria), nenhum log de aplicacao. O
    # driver syslog do Docker fixa HOSTNAME="localhost" (nao da pra trocar),
    # entao quem separa por servico e' a tag: cai em
    # /var/log/remote/us/wallet.log, retencao de 7 dias pelo mesmo
    # logrotate que ja cobre o resto da frota.
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:514"
        tag: "wallet"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M
    depends_on:
      - redis
      - ccxt
  ccxt:
    image: registry.rcaldas.com/rcaldas/ccxt:1.2
    restart: unless-stopped
    environment:
      # OKX primeiro (maior volume que Kraken); Binance em segundo — o VPS
      # atual (Linode Atlanta/EUA) toma 451 da Binance por geobloqueio
      # jurídico, então ela sempre falha e cai pra próxima. Reordenado pra
      # não gastar a primeira tentativa numa exchange que sabemos que falha
      # aqui. Reavaliar quando migrar de região.
      CCXT_EXCHANGES: okx,binance,kraken
      CCXT_CACHE_TTL: "10"
    # Ver explicação completa no bloco `wallet` acima.
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:514"
        tag: "ccxt"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
  # UM worker de email pra todos os apps. Antes eram dois containers com
  # filas separadas, so' porque nome, URL do logo e conjunto de templates
  # vinham do ambiente DO WORKER. Agora vem no payload (`brand`), publicado
  # por quem manda a mensagem -- que e' quem sabe quem e'.
  #
  # Pra aumentar vazao, suba replicas em vez de containers por app: o
  # `blmove` do Redis e' atomico, entao N workers dividem a mesma fila com
  # seguranca. Cada um usa a propria fila de processamento
  # (email:processing:<hostname>), que e' o que evita um worker devolver pra
  # fila a mensagem que outro esta enviando -- e mandar duas vezes.
  emailer:
    # 1.6: identidade por mensagem, conexao SMTP reaproveitada, fila de
    # processamento por worker. Precisa de imagem nova -- app.py e' assado na
    # imagem (so' os templates sao montados), entao ficar no 1.5 rodaria o
    # worker antigo sem nenhum aviso.
    image: registry.rcaldas.com/rcaldas/emailer:5e14341
    restart: unless-stopped
    env_file: .env
    networks:
      - default
      - mailu_default
    # Ver explicação completa no bloco `wallet` acima.
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:514"
        tag: "emailer"
    deploy:
      # replicas: 3   # descomente se a fila comecar a acumular
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 64M
    depends_on:
      - redis
  redis:
    image: redis:8-alpine
    container_name: rcweb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 64M
  # --- Visualizacao de log centralizado -------------------------------
  # Ate aqui o log de aplicacao de cada servico so existia como arquivo em
  # /var/log/remote/us/<servico>.log, alcancavel por ssh + sudo: sem busca,
  # sem grafico, sem historico alem de 7 dias. Estes tres containers sao o
  # visualizador -- e cobrem de quebra o syslog de host da frota
  # (bag/lev/tp), que ja chegava no mesmo diretorio e e a maior parte do
  # volume (80 dos 81MB medidos em 23/08/2026).
  #
  # Imagens PUBLICAS: ao contrario do resto da stack, nao passam pelo
  # registry.rcaldas.com e nao dependem de build/push. `up -d` sobe.
  #
  # Os limites de memoria abaixo nao sao decorativos: o us tem ~1,7Gi livre
  # e ZERO swap. Container sem teto que surta leva o OOM killer pra cima do
  # vizinho.
  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./monitor/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 64M
  alloy:
    image: grafana/alloy:v1.18.1
    restart: unless-stopped
    # /var/log/remote/ e' 0750 root:root e os arquivos 0640 root:root. A
    # imagem do Alloy roda como usuario nao-root por padrao, entao sem isto
    # o tail falha e o Loki fica vazio SEM erro obvio.
    user: root
    command:
      - run
      - /etc/alloy/config.alloy
      # Onde fica o arquivo de posicoes. Precisa ser volume nomeado, senao
      # todo restart reingere os arquivos do zero e duplica linha no Loki.
      - --storage.path=/var/lib/alloy/data
      # UI de diagnostico presa no loopback do host -- serve pra conferir
      # os targets ativos quando algo nao aparece no Grafana.
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "127.0.0.1:12345:12345"
    environment:
      # O GC do Go nao enxerga o limite do cgroup: ele cresce o heap ate o
      # container morrer, e sem swap no host isso e' OOM de verdade. Com
      # GOMEMLIMIT o GC fica agressivo ao se aproximar em vez de estourar.
      # 150MiB deixa ~42MB de folga pro que nao e' heap dentro dos 192M.
      - GOMEMLIMIT=150MiB
    volumes:
      - ./monitor/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/log/remote:/var/log/remote:ro
      # Journal do proprio us: e' onde vivem as mensagens de kernel
      # (nftables/LIMBO), que o rsyslog perdeu pro journald. Ver o
      # comentario longo em monitor/alloy.alloy.
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # /var/log inteiro num ponto SEPARADO, so' pra alcancar o
      # fail2ban.log. Nao reaproveita o mount de /var/log/remote acima de
      # proposito: mudar o caminho de um alvo ja lido zera as posicoes e
      # reingere tudo duplicado. Os globs nao se cruzam.
      - /var/log:/hostlogs:ro
      - alloy-data:/var/lib/alloy/data
    deploy:
      resources:
        limits:
          # 192 e nao 128: no primeiro start o Alloy le os 7 dias que ja
          # estao em disco de uma vez (243k linhas medidas no us) e bateu
          # 117MB nesse pico -- 91% de um teto de 128M, sem margem nenhuma.
          # Em regime ele fica em ~89MB.
          memory: 192M
        reservations:
          memory: 32M
    depends_on:
      - loki
  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    ports:
      - "8616:3000"
    # `environment:` explicito em vez do `env_file: .env` que os apps usam:
    # aquele despeja TODAS as variaveis no container, o que colocaria
    # MONGO_URI, CF_TOKEN e afins dentro do Grafana sem nenhuma necessidade.
    environment:
      # Atras de TLS terminado no HAProxy, sem isto o Grafana monta redirect
      # e URL de asset em http:// e a UI quebra de formas confusas.
      - GF_SERVER_ROOT_URL=https://logs.rcaldas.com
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?defina GF_SECURITY_ADMIN_PASSWORD no .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Alerta por conteudo de log (Fase 2). O Grafana avalia a regra e
      # manda webhook; quem transforma em incidente e' o app, que ja tem
      # dedupe, email so' na transicao e teto por host/hora.
      #
      # Vai por `${VAR}` no arquivo de provisionamento, entao o valor
      # precisa existir NO AMBIENTE DO GRAFANA -- nao basta estar no .env
      # do compose. Este bloco e' o que faz a ponte.
      - LOG_ALERT_TOKEN=${LOG_ALERT_TOKEN:?defina LOG_ALERT_TOKEN no .env}
      - MONITOR_WEBHOOK_URL=${MONITOR_WEBHOOK_URL:-https://web.rcaldas.com/api/log-alert}
    volumes:
      - ./monitor/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboards versionados em arquivo. Em /etc/grafana e nao dentro de
      # /var/lib/grafana de proposito: aquele e' volume nomeado, e montar um
      # bind dentro de um volume e' aninhamento fragil sem necessidade.
      # O provider recarrega a cada 30s, entao editar o JSON no repo e dar
      # pull ja atualiza a tela sem restart. Em compensacao editar pela UI
      # nao persiste (allowUiUpdates: false) -- o que vale e' o arquivo.
      - ./monitor/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          # 512 e nao 256/384: o Grafana 13 fica em ~310MB so' de ocioso no
          # us (222MB em teste local numa maquina maior). Com teto de 384
          # isso e' 80% em regime, folga pequena demais pra aguentar uma
          # consulta pesada sem levar OOM.
          memory: 512M
        reservations:
          memory: 64M
    depends_on:
      - loki
networks:
  mailu_default:
    external: true
volumes:
  redis-data:
  loki-data:
  alloy-data:
  grafana-data:
