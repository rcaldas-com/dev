# Stack unica: web, wallet, car e site no mesmo compose, com um Mongo, um
# Redis e UM emailer. O car veio do compose proprio (repo car-dev, aposentado)
# em 22/08/2026 -- ele sempre usou o mesmo banco e o mesmo cookie de sessao
# que o web, entao compartilhar a infra e' reconhecer o que ja era.
#
# TITLE, DESCRIPTION e AUTH_TRUST_HOST vem do .env pro `web`; os outros apps
# sobrescrevem em `environment:`. Sao as unicas variaveis que precisam
# divergir -- conferido comparando o env real dos containers, var por var.
services:
  web:
    image: registry.rcaldas.com/rcaldas/web:2.9
    restart: unless-stopped
    ports:
      - "8611:3000"
    env_file: .env
    environment:
      - HOSTNAME=0.0.0.0
    networks:
      - default
      - mailu_default
    volumes:
      - /var/rcaldas/live/home:/var/rcaldas/live/home:ro
      - /var/rcaldas/live/bin:/var/rcaldas/live/bin:ro
      - /var/rcaldas/live/upload:/var/rcaldas/live/upload
      - /var/zxnet/.ssh/pending-keys:/var/zxnet/.ssh/pending-keys
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M
    depends_on:
      - redis
  car:
    image: registry.rcaldas.com/rcaldas/car:3.4
    restart: unless-stopped
    ports:
      - "8612:3000"
    env_file: .env
    environment:
      - AUTH_TRUST_HOST=https://car.rcaldas.com
      - TITLE=Car App
      - DESCRIPTION=Controle de veículos e manutenção automotiva.
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M
    depends_on:
      - redis
  site:
    image: registry.rcaldas.com/rcaldas/site:0.1
    restart: unless-stopped
    ports:
      - "8615:80"   # 8614 ja e' o rcaldas-static
    deploy:
      resources:
        limits:
          memory: 128M   # nginx servindo arquivo estatico: nao precisa de mais
        reservations:
          memory: 16M
  wallet:
    image: registry.rcaldas.com/rcaldas/wallet:1.5
    restart: unless-stopped
    ports:
      - "8613:3000"
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M
    depends_on:
      - redis
      - ccxt
  ccxt:
    image: registry.rcaldas.com/rcaldas/ccxt:1.1
    restart: unless-stopped
    environment:
      # OKX primeiro (maior volume que Kraken); Binance em segundo — o VPS
      # atual (Linode Atlanta/EUA) toma 451 da Binance por geobloqueio
      # jurídico, então ela sempre falha e cai pra próxima. Reordenado pra
      # não gastar a primeira tentativa numa exchange que sabemos que falha
      # aqui. Reavaliar quando migrar de região.
      CCXT_EXCHANGES: okx,binance,kraken
      CCXT_CACHE_TTL: "10"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
  # UM worker de email pra todos os apps. Antes eram dois containers com
  # filas separadas, so' porque nome, URL do logo e conjunto de templates
  # vinham do ambiente DO WORKER. Agora vem no payload (`brand`), publicado
  # por quem manda a mensagem -- que e' quem sabe quem e'.
  #
  # Pra aumentar vazao, suba replicas em vez de containers por app: o
  # `blmove` do Redis e' atomico, entao N workers dividem a mesma fila com
  # seguranca. Cada um usa a propria fila de processamento
  # (email:processing:<hostname>), que e' o que evita um worker devolver pra
  # fila a mensagem que outro esta enviando -- e mandar duas vezes.
  emailer:
    # 1.6: identidade por mensagem, conexao SMTP reaproveitada, fila de
    # processamento por worker. Precisa de imagem nova -- app.py e' assado na
    # imagem (so' os templates sao montados), entao ficar no 1.5 rodaria o
    # worker antigo sem nenhum aviso.
    image: registry.rcaldas.com/rcaldas/emailer:1.6
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./emailer/templates:/app/templates:ro
    networks:
      - default
      - mailu_default
    deploy:
      # replicas: 3   # descomente se a fila comecar a acumular
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 64M
    depends_on:
      - redis
  redis:
    image: redis:8-alpine
    container_name: rcweb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 500M
        reservations:
          memory: 64M
networks:
  mailu_default:
    external: true
volumes:
  redis-data:
