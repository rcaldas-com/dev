# Router de teste — DHCP + DNS forwarder, só na interface do adaptador USB.
# Risco: subir isso na interface errada envenena a rede de casa inteira.
# Por isso: interface explícita + bind-interfaces (nunca bind-dynamic).

interface=enxd03745ea2d6b
bind-interfaces
except-interface=lo

# DNS ligado, como forwarder pros públicos -- agora que a rede de teste
# também entrega internet de verdade (share-internet.sh), os clientes
# precisam de um DNS utilizável via DHCP, não só descoberta de lease.
# Continua seguro: a interface segue isolada e explícita, isso não muda.
no-resolv
server=1.1.1.1
server=8.8.8.8

dhcp-range=10.84.0.50,10.84.0.99,1h
dhcp-option=6,10.84.0.1
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Reservas de IP fixo por MAC (host conhecido/aprovado). Arquivo separado
# pra poder reescrever sem tocar no resto da config -- hoje mantido a mao
# com reserve.sh, amanha vira o alvo do que o /router (ainda nao existe)
# gera a partir do Monitor.
dhcp-hostsfile=/etc/dnsmasq-hosts/hosts.conf

log-dhcp
log-queries
