# Convencao de Dockerfile em toda a stack: `Dockerfile` e' PRODUCAO,
# `Dockerfile.dev` e' desenvolvimento -- e' por isso que todo build aqui
# aponta explicitamente pro .dev.
#
# O default do Docker e' `Dockerfile`, e o default tem que ser o caminho em
# que errar custa caro. Era o contrario (Dockerfile.prd pro build de
# producao): um `docker build -t ...:nova-versao .` sem o -f gerava
# silenciosamente uma imagem de DEV e publicava. Agora esquecer a flag
# produz a imagem certa, e quem paga o -f e' o dev, onde o erro aparece na
# hora.
#
# o emailer nao tem .dev: o mesmo Dockerfile serve os dois ambientes. Criar
# um par identico so' pra uniformizar seria duplicacao.
services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - 8001:80   # rcaldas: web (/) + wallet (/wallet)
      - 8009:81   # car -- mesma porta que o stack antigo do car-dev usava
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
      - wallet
      - car
  web:
    build:
      context: web/
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./web/app:/app/app
      - ./web/components:/app/components
      - ./web/lib:/app/lib
      - ./web/public:/app/public
      - ./web/middleware.ts:/app/middleware.ts
      - ./web/package.json:/app/package.json
      - ./web/package-lock.json:/app/package-lock.json
    depends_on:
      - mongo
      - redis
  wallet:
    build:
      context: wallet/
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./wallet/app:/app/app
      - ./wallet/public:/app/public
      - ./wallet/middleware.ts:/app/middleware.ts
      - ./wallet/next.config.js:/app/next.config.js
      - ./wallet/tsconfig.json:/app/tsconfig.json
      - ./wallet/postcss.config.mjs:/app/postcss.config.mjs
      - ./wallet/tailwind.config.ts:/app/tailwind.config.ts
      - ./wallet/eslint.config.mjs:/app/eslint.config.mjs
      - ./wallet/package.json:/app/package.json
      - ./wallet/package-lock.json:/app/package-lock.json
    depends_on:
      - mongo
      - redis
      - ccxt
  # car veio do stack proprio (repo car-dev) pra ca. O ganho e' parar de
  # subir um segundo mongo/redis/minio no host de desenvolvimento -- o car
  # sempre usou o MESMO banco e o MESMO cookie de sessao que o web
  # (AUTH_SECRET e MONGO_URI identicos, conferido em producao), entao
  # compartilhar a infra e' reconhecer o que ja era, nao uma mudanca.
  car:
    build:
      context: car/
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      # O .env e' um so' pra stack inteira. Estes sao os UNICOS valores que
      # precisam divergir entre os apps -- conferido comparando o env real
      # dos containers em producao, var por var.
      AUTH_TRUST_HOST: http://localhost:8009
      TITLE: Car
      DESCRIPTION: Controle de manutencoes
      # Sem TEMPLATE_PREFIX aqui: o prefixo agora vai no payload da mensagem
      # (app/lib/email.ts), nao no ambiente. Deixar a variavel sobrando so'
      # criaria a duvida de qual das duas manda.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./car/app:/app/app
      - ./car/public:/app/public
      - ./car/scripts:/app/scripts
      - ./car/middleware.ts:/app/middleware.ts
      - ./car/tailwind.config.ts:/app/tailwind.config.ts
      - ./car/package.json:/app/package.json
      - ./car/package-lock.json:/app/package-lock.json
      - ./car/next.config.js:/app/next.config.js
      - ./car/tsconfig.json:/app/tsconfig.json
    depends_on:
      - mongo
      - redis
  # Site estatico. Em dev roda `next dev` normal (Dockerfile.dev); o
  # output: 'export' so' aparece no build de producao.
  site:
    build:
      context: site/
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - 8002:3000
    volumes:
      - ./site/app:/app/app
      - ./site/public:/app/public
      - ./site/next.config.js:/app/next.config.js
      - ./site/package.json:/app/package.json
      - ./site/package-lock.json:/app/package-lock.json
  ccxt:
    build:
      context: ./ccxt
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      # Mesma ordem do prod (docker-compose.prod.yml) — OKX primeiro (maior
      # volume que Kraken), Binance em segundo.
      CCXT_EXCHANGES: okx,binance,kraken
      CCXT_CACHE_TTL: "10"
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - 27011:27017
    volumes:
      - ./db:/data/db
  redis:
    image: redis:8
    restart: unless-stopped
    volumes:
      - ./redis-data:/data
  emailer:
    build: ./emailer
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./emailer/app.py:/app/app.py
      - ./emailer/templates:/app/templates
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - ./minio:/data
