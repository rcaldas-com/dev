# Datasource provisionado em arquivo: o Grafana sobe ja apontando pro Loki,
# sem nenhum clique na UI. Tambem significa que recriar o container (ou
# perder o volume) nao perde a configuracao.
apiVersion: 1

# Trocar o uid de um datasource JA provisionado nao funciona: o Grafana
# procura pelo uid novo, nao acha, e falha o modulo de provisionamento
# inteiro -- o container entra em loop de restart e a UI nao sobe. Este
# bloco apaga o antigo pelo nome antes de recriar. Pode ficar aqui
# permanentemente: apagar-e-recriar e' idempotente, e o datasource nao
# guarda estado nenhum (dashboards vem de arquivo tambem).
deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    type: loki
    # uid fixo: os dashboards provisionados apontam pra ele por uid. Sem
    # fixar, o Grafana gera um aleatorio e todo painel sobe quebrado.
    uid: loki
    access: proxy
    # Nome do servico no compose -- resolve pela rede default da stack.
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      # Teto por consulta. Sem isso o default (1000) corta resultado em
      # busca ampla sem avisar direito.
      maxLines: 5000
