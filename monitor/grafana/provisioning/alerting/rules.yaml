# Regras de alerta por CONTEUDO de log.
#
# A LISTA DE EXCLUSAO NAO E' REFINAMENTO, E' PRE-REQUISITO
# --------------------------------------------------------
# Medido no log real antes de escrever isto: no `web.log`, 8 de 22 linhas
# casam com /error|warn/i -- e as 8 sao ruido de boot do pdfjs, incluindo
# uma que contem literalmente "Error: Cannot find module '@napi-rs/canvas'".
# No `emailer.log`, a linha SAUDAVEL e' "Erros: 0", que tambem casa.
#
# Sem os `!=` abaixo esta regra dispararia em TODO deploy. Antes de
# adicionar padrao novo, rode a query no Grafana sobre os ultimos dias e
# veja quantas vezes ela TERIA disparado.
#
# `warn` esta fora do padrao de proposito: no log desta frota ele e' quase
# todo ruido de inicializacao.
apiVersion: 1

groups:
  - orgId: 1
    name: log
    folder: RCaldas
    # De quanto em quanto tempo a regra e' avaliada.
    interval: 1m
    rules:
      - uid: rcaldas-log-erro-sustentado
        title: Erro sustentado no log
        condition: limiar
        # 10 minutos disparando antes de virar alerta. Mesmo espirito do
        # CONSECUTIVE_BREACHES_REQUIRED=3 que ja existe pra cpu/memoria:
        # o que interessa e' problema que PERSISTE. O caso que originou o
        # projeto -- a cotacao BTC falhando -- durou dias; um pico de 1
        # minuto num deploy nao deve acordar ninguem.
        for: 10m
        annotations:
          summary: '{{ $labels.service }} em {{ $labels.host }} com erro repetido no log'
          description: Linhas de erro acima do limite por 10 minutos seguidos. Veja o log no Grafana pra saber o que e.
          # Mesmo filtro do `expr` abaixo. O email usa isto pra trazer as
          # linhas do PROBLEMA em vez das ultimas linhas do servico -- sem
          # ele, um alerta de haproxy vinha com log de acesso comum no
          # corpo, sem relacao com o assunto. Manter os dois em sincronia:
          # mudou o expr, muda aqui.
          logFilter: '|~ `(?i)(error|erro|fatal|critical|exception|traceback)` | detected_level!~`info|debug` != `Cannot polyfill` != `@napi-rs/canvas` != `Erros: 0` != `[resolver] failed to query external DNS server` != `SSL handshake failure` != `Rejected send message` != `Connection reset by peer` != `Failed TLS handshake` != `Lost device connection` != `Failed to scan` != `Failed to exchange Hello messages` != `Error reading SSH protocol banner` != `Processando email` != `SMTP aceitou email` != `ALSA lib` != `audio device` != `ALSA sequencer` != `pulse)`'
        labels:
          severity: warning
        isPaused: false
        noDataState: OK
        # Sem dado = servico calado. Pode ser bom (nao errou) ou pessimo
        # (morreu), e esta regra nao sabe distinguir -- quem cobre queda e'
        # o sweepOfflineHosts. Alertar aqui so' geraria falso positivo.
        execErrState: OK
        data:
          - refId: consulta
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: consulta
              datasource:
                type: loki
                uid: loki
              editorMode: code
              queryType: range
              # CADA EXCLUSAO ABAIXO FOI MEDIDA, nao adivinhada. Em 7 dias o
              # filtro antigo casava 5.267 linhas no us e disparava 8 vezes
              # em 2 dias; com estas, casa 779 e dispara 1. O que sobra e'
              # o que vale acordar alguem.
              #
              # `| detected_level!~info|debug` -- o containerd loga
              #   `level=info msg="skip loading plugin" error="..."`: a
              #   palavra error e' CAMPO, nao severidade. Sozinho isso eram
              #   988 de 1.003 linhas dele.
              #   ARMADILHA: detected_level e' structured metadata, entao
              #   so' funciona como filtro de PIPELINE. No seletor
              #   ({...,detected_level!~"info"}) ele e' silenciosamente
              #   IGNORADO -- medido: 1003 antes, 1003 depois.
              #
              # resolver failed to query -- dockerd, 1.489 linhas. DNS
              #   embutido do Docker falhando pra um container so'. Ruido
              #   cronico como alerta, mas vale investigar a causa a parte.
              # SSL handshake failure -- haproxy, 1.524. Sao scanners e a
              #   propria borda da Cloudflare sondando com SNI que nao
              #   casa. Nao ha o que fazer com cada uma.
              # Rejected send message -- dbus, negacao de politica normal.
              # Connection reset by peer -- novnc/wssh, cliente sumiu.
              # Failed TLS handshake / Lost device connection / Failed to
              #   scan / Failed to exchange Hello -- syncthing, churn de
              #   conexao entre os proprios hosts.
              # Error reading SSH protocol banner -- wssh, idem.
              # Processando email / SMTP aceitou email -- LOOP DE
              #   REALIMENTACAO: o emailer loga o assunto do email que ele
              #   esta enviando, e o assunto contem "erro no log de". O
              #   alerta estava alertando sobre o proprio email de alerta.
              # ALSA lib / audio device / ALSA sequencer / pulse) -- 248 em
              #   7d. fluidsynth tentando abrir audio em maquina sem sessao
              #   grafica; com estes quatro sobra ZERO linha de fluidsynth.
              #   Chegou aqui por um caminho que vale registrar: o alerta
              #   disparou como "us: erro no log de fluidsynth" -- num VPS
              #   sem placa de som e SEM fluidsynth instalado. Era o log do
              #   'len', que se anunciava como "localhost" no rsyslog e ia
              #   TODO pro diretorio do us. Alerta atribuido ao host errado
              #   e' pior que alerta ruidoso: manda investigar a maquina
              #   errada. Corrigido na origem (01-hostname.conf); o filtro
              #   aqui e' pra parte que sobrou, que e' ruido de verdade.
              expr: >-
                sum by (host, service) (
                  count_over_time(
                    {job=~"remote-logs|host-journal|host-files"}
                    |~ `(?i)(error|erro|fatal|critical|exception|traceback)`
                    | detected_level!~`info|debug`
                    != `Cannot polyfill` != `@napi-rs/canvas` != `Erros: 0`
                    != `[resolver] failed to query external DNS server`
                    != `SSL handshake failure`
                    != `Rejected send message`
                    != `Connection reset by peer`
                    != `Failed TLS handshake` != `Lost device connection`
                    != `Failed to scan` != `Failed to exchange Hello messages`
                    != `Error reading SSH protocol banner`
                    != `Processando email` != `SMTP aceitou email`
                    != `ALSA lib` != `audio device` != `ALSA sequencer` != `pulse)`
                    [5m]
                  )
                )
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: reduz
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: reduz
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: consulta
              reducer: last
              settings:
                mode: dropNN
          - refId: limiar
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: limiar
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: reduz
              conditions:
                - evaluator:
                    # 10 linhas de erro em 5 minutos. Escolhido pra ficar
                    # bem acima do ruido de boot medido (8 linhas, uma vez
                    # por deploy) e bem abaixo de um loop de erro de
                    # verdade, que produz centenas.
                    type: gt
                    params: [10]

      - uid: rcaldas-disco-degradando
        title: Disco degradando
        condition: limiar
        # Curto porque o dado ja e' lento: o coletor roda de hora em hora.
        # O que se quer evitar aqui nao e' pico passageiro -- e' descobrir
        # tarde. O sdb do bag ficou 3 dias com erro de I/O sem ninguem ver.
        for: 15m
        annotations:
          summary: '{{ $labels.host }} com disco degradando'
          description: >-
            Contador de erro de disco diferente de zero. ATENCAO: o SMART
            pode dizer PASSED e o disco estar ruim -- ele so' reprova quando
            um atributo cruza o limiar, e ate la ja pode haver centenas de
            setores realocados. Olhe os contadores, nao o veredito.
          logFilter: '|~ `zfs erros:|realoc=[1-9]|pendentes=[1-9]|incorrigiveis=[1-9]|vdev_state=(UNAVAIL|FAULTED|DEGRADED|REMOVED)|state: (DEGRADED|FAULTED|UNAVAIL)`'
        labels:
          severity: critical
        isPaused: false
        noDataState: OK
        execErrState: OK
        data:
          - refId: consulta
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: loki
            model:
              refId: consulta
              datasource: { type: loki, uid: loki }
              editorMode: code
              queryType: range
              # Casa o que o scripts/disk-health.sh emite como problema:
              # erro contabilizado pelo ZFS, ou contador SMART != 0.
              # `realoc=0` nao casa porque o primeiro digito tem que ser 1-9.
              #
              # vdev_state / state: -- POOL DEGRADADO SEM NENHUM ERRO.
              # Faltava, e custou um caso real: no reboot do 'bag' em
              # 01/09 um disco trocou de sdd pra sda, o ZFS nao achou o
              # label e o pool ficou DEGRADED por ~50min. Nada alertou.
              #
              # O motivo e' que os contadores acima ficaram todos em ZERO:
              # `errors: No known data errors`, SMART tudo PASSED. Nao
              # havia erro de leitura -- havia um device AUSENTE. Contador
              # de erro nao cobre indisponibilidade, e essa e' justamente
              # a falha que deixa o raidz1 sem redundancia.
              #
              # As duas fontes entram porque tem tempos diferentes: o zed
              # emite `vdev_state=` no instante do evento (22:21:48), o
              # disk-health emite `state:` no poll horario (22:26:39). A
              # primeira alerta rapido; a segunda garante que continua
              # alertando enquanto durar, mesmo que o evento se perca.
              # ONLINE fica de fora de proposito -- e' a recuperacao, e e'
              # o que fecha o incidente.
              # Medido em 14 dias: +35 linhas, todas eventos reais de
              # disco (a troca do sdb em 29/08 e este caso). Zero ruido.
              expr: >-
                sum by (host) (
                  count_over_time(
                    {job=~"remote-logs|host-journal"}
                    |~ `zfs erros:|realoc=[1-9]|pendentes=[1-9]|incorrigiveis=[1-9]|vdev_state=(UNAVAIL|FAULTED|DEGRADED|REMOVED)|state: (DEGRADED|FAULTED|UNAVAIL)`
                    [3h]
                  )
                )
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: reduz
            relativeTimeRange: { from: 10800, to: 0 }
            datasourceUid: __expr__
            model:
              refId: reduz
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: consulta
              reducer: last
              settings: { mode: dropNN }
          - refId: limiar
            relativeTimeRange: { from: 10800, to: 0 }
            datasourceUid: __expr__
            model:
              refId: limiar
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: reduz
              conditions:
                - evaluator:
                    # Qualquer ocorrencia. Contador de erro de disco nao tem
                    # nivel "aceitavel" -- zero ou investiga.
                    type: gt
                    params: [0]

      - uid: rcaldas-loop-rebuild
        title: Loop de rebuild
        condition: limiar
        # Curto: se o mesmo commit ja foi enfileirado 3x, o loop esta
        # acontecendo AGORA e cada ciclo gasta um worker inteiro. Esperar
        # mais so' aumenta o desperdicio.
        for: 5m
        annotations:
          summary: 'Mesmo commit sendo reconstruido em loop: {{ $labels.svc }} {{ $labels.sha }}'
          description: >-
            O mesmo SHA foi enfileirado para build mais de 2x em 30 minutos.
            Duas vezes ainda pode ser retry legitimo (build falhou e refez);
            a partir da terceira costuma ser loop -- promocao que nao fecha,
            reconciliacao que reabre o pedido, ou build que falha sempre no
            mesmo ponto. Veja o log do agente no worker pra saber onde para.
          logFilter: '|= `build automatico enfileirado`'
        labels:
          severity: warning
        isPaused: false
        noDataState: OK
        execErrState: OK
        data:
          - refId: consulta
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: loki
            model:
              refId: consulta
              datasource: { type: loki, uid: loki }
              editorMode: code
              queryType: range
              # A pipeline escreve no stdout do `web`, que chega no Loki
              # como service_name="web" -- nao ha banco separado disso, o
              # log E o historico.
              expr: >-
                sum by (svc, sha) (
                  count_over_time(
                    {service_name="web"}
                    |= `build automatico enfileirado`
                    | regexp `enfileirado: (?P<svc>\S+) (?P<sha>\S+) em (?P<worker>\S+)`
                    [30m]
                  )
                )
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: reduz
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: __expr__
            model:
              refId: reduz
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: consulta
              reducer: last
              settings: { mode: dropNN }
          - refId: limiar
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: __expr__
            model:
              refId: limiar
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: reduz
              conditions:
                - evaluator:
                    # "mais de 2x", como pedido: 2 ainda e' retry plausivel.
                    type: gt
                    params: [2]
