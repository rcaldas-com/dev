# Ban para servico que roda em CONTAINER.
#
# O PROBLEMA QUE ISTO RESOLVE
# ---------------------------
# As acoes padrao do fail2ban (iptables-multiport, iptables-allports)
# inserem a regra na chain INPUT. Isso funciona pra servico do host --
# sshd, haproxy -- e NAO funciona pra container com porta publicada:
# esse trafego e' DNAT no nat/PREROUTING e segue por FORWARD, sem nunca
# passar por INPUT. O ban entra, o IP fica na lista, e nada bloqueia.
#
# Foi exatamente o que aconteceu com a jail bad-auth-bots (mailu-front):
# 24.563 falhas registradas, 8 bans, e o ipset com References: 0 -- ou
# seja, ninguem consultava o conjunto. Nos logs isso aparece como milhares
# de linhas "already banned": o fail2ban detectando de novo os mesmos IPs
# que ele acha que ja barrou.
#
# A chain certa e' DOCKER-USER: o Docker a consulta no caminho de FORWARD
# e, ao contrario das chains DOCKER-*, nao a reescreve a cada container.
#
# ATENCAO A PORTA: dentro do DOCKER-USER o pacote JA passou pelo DNAT,
# entao a porta de destino e' a do CONTAINER, nao a publicada no host
# (o mailu-front publica 2580 -> 80; ali dentro se ve 80). Por isso esta
# acao nao filtra porta nenhuma: um IP banido nao deve alcancar nada.
#
# DURABILIDADE
# ------------
# O `iptables` aqui e' nf_tables, entao as regras dele vivem no MESMO
# ruleset que /etc/nftables.conf apaga com `flush ruleset`. Qualquer
# reload do nftables (e o restart do Docker que vem depois) leva esta
# regra junto. O actioncheck abaixo e' o que fecha esse buraco: o
# fail2ban o executa antes de cada ban e, se falhar, re-roda o
# actionstart sozinho -- a protecao se restaura sem intervencao.

[Definition]

actionstart = ipset create <ipmset> hash:net -exist
              <iptables> -C DOCKER-USER -m set --match-set <ipmset> src -j <blocktype> 2>/dev/null || <iptables> -I DOCKER-USER -m set --match-set <ipmset> src -j <blocktype>

actionstop = <iptables> -D DOCKER-USER -m set --match-set <ipmset> src -j <blocktype> 2>/dev/null || true
             ipset flush <ipmset> 2>/dev/null || true
             ipset destroy <ipmset> 2>/dev/null || true

# Roda antes de cada ban. Se a regra sumiu (flush do nftables, restart do
# Docker), retorna erro e o fail2ban re-executa o actionstart.
actioncheck = <iptables> -C DOCKER-USER -m set --match-set <ipmset> src -j <blocktype>

actionban = ipset add -exist <ipmset> <ip><netmask>

actionunban = ipset del -exist <ipmset> <ip><netmask>

[Init]

# Nome do conjunto. Um por jail, pra unban e estatistica nao se
# atrapalharem entre jails diferentes.
ipmset = f2b-<name>

# Vazio = bane o IP exato. Use "/24" na jail pra banir a faixa inteira --
# util contra botnet que rotaciona endereco dentro do mesmo bloco, que e'
# o caso do 213.176.26.0/24 visto no mailu.
netmask =

blocktype = DROP

iptables = iptables
