#!/usr/sbin/nft -f

# ATENCAO ANTES DE RECARREGAR ESTE ARQUIVO
# ----------------------------------------
# O `flush ruleset` abaixo apaga o ruleset INTEIRO -- e o iptables desta
# maquina e' nf_tables, entao as regras do Docker e do fail2ban moram no
# mesmo lugar e vao junto. Depois de um reload puro os containers ficam
# inalcancaveis de fora e os bans do fail2ban param de valer EM SILENCIO
# (o ipset continua la, so' que sem ninguem consultando).
#
# Use sempre: sudo /var/rcaldas/rcaldas/scripts/nftables-reload.sh
# Ele valida, aplica, reinicia o docker (que recria a DOCKER-USER) e
# depois o fail2ban (que insere dentro dela), nessa ordem, e confere no
# fim se sobrou algum ipset com References: 0.
#
# MELHOR AINDA: pra liberar/bloquear porta ou IP no dia a dia, NAO
# recarregue este arquivo. Os sets abaixo tem nome, e set nomeado se
# altera a quente, sem flush:
#
#   nft add element inet filter hosts_bloqueados { 1.2.3.4 }
#   nft delete element inet filter hosts_bloqueados { 1.2.3.4 }
#   nft add element inet filter portas_tcp { 8080 }
#
# Depois so' espelhe a mudanca aqui pra sobreviver ao boot.

flush ruleset

define wan = eth0

table inet filter {

	# --- Sets nomeados -------------------------------------------------
	#
	# Antes isto era uma lista de ~13 regras `tcp dport X accept`
	# avaliadas em sequencia, uma por pacote. Agora sao duas consultas a
	# conjunto. No volume de hoje a diferenca de CPU e' irrelevante -- o
	# motivo real de fazer assim e' (a) poder mexer a quente, sem flush, e
	# (b) ter UM lugar pra olhar quando alguem pergunta "que porta esta
	# aberta nessa maquina?".
	#
	# `flags interval` e' obrigatorio pra aceitar faixas (21114-21119).

	set portas_tcp {
		type inet_service
		flags interval
		elements = {
			25,		# SMTP (Mailu)
			80,		# HTTP -> HAProxy
			443,		# HTTPS -> HAProxy
			587,		# submission (Mailu)
			4443,		# Jitsi
			6443,		# Kube API
			8417,		# MongoDB
			8422,		# SSH (a 22 NAO e' aberta de proposito)
			21114-21119,	# RustDesk (21114 = API/console; ver nota abaixo)
			22000,		# Syncthing
			7700-7799	# tuneis reversos ZX / frota
		}
	}

	set portas_udp {
		type inet_service
		flags interval
		elements = {
			10000,		# Jitsi
			21116		# RustDesk
		}
	}

	# Editavel a quente -- e' o ponto principal de ter virado set nomeado.
	# Bloqueio pontual de scanner nao exige mais recarregar o arquivo (e
	# portanto nao arrisca derrubar Docker/fail2ban).
	set hosts_bloqueados {
		type ipv4_addr
		flags interval
		elements = {
			80.94.95.209,
			80.94.95.229,
			81.30.107.119,
			81.30.107.134,
			81.30.107.146,
			130.12.181.0/24
		}
	}

	set hosts_confiaveis {
		type ipv4_addr
		flags interval
		elements = { 45.56.114.108 }	# o proprio us
	}

	chain input {
		type filter hook input priority 0; policy drop;

		iifname lo accept

		ip saddr @hosts_confiaveis accept
		ip saddr @hosts_bloqueados drop

		# Fica cedo de proposito: a esmagadora maioria dos pacotes de uma
		# conexao ja estabelecida casa aqui e nao percorre o resto.
		ct state established,related accept

		ip protocol icmp accept
		icmpv6 type {
			destination-unreachable, packet-too-big,
			time-exceeded, parameter-problem,
			echo-request, echo-reply,
			nd-router-solicit, nd-router-advert,
			nd-neighbor-solicit, nd-neighbor-advert
		} accept

		tcp dport @portas_tcp accept
		udp dport @portas_udp accept

		# Fora dos sets porque tem condicao de interface: so' vale fora da
		# WAN. Set nao carrega esse tipo de qualificacao.
		tcp dport 3306 iifname != $wan accept

		# Drop explicito, antes do log: telnet e' so' ruido de scanner e
		# nao interessa nem ver.
		tcp dport 23 drop

		### Desativados -- mantidos como documentacao do que ja existiu
		#tcp dport {2379,2380} ip saddr $kube_hosts accept	# ETCD
		#tcp dport 10250 ip saddr $kube_hosts accept		# Kubelet
		#tcp dport 53 iifname != $wan accept			# KubeDNS
		#udp dport 53 iifname != $wan accept
		#tcp dport 179 ip saddr $kube_hosts accept		# Calico BGP
		#udp dport 4789 ip saddr $kube_hosts accept		# Calico VXLAN
		#tcp dport 514 ip saddr $kube_hosts accept		# rsyslog
		#udp dport 514 ip saddr $kube_hosts accept

		# Este contador e' o CENSO do que e' dropado. O log abaixo e'
		# amostra (limitado a 100/min): se o trafego passar disso, o log
		# trunca e o contador nao. Pra "quantos pacotes?" olhe aqui; pra
		# "o que exatamente esta chegando?" olhe o log no Grafana.
		counter comment "total unfiltered input packets"
		limit rate 100/minute burst 20 packets log prefix "LIMBO: "
	}

	chain forward {
		type filter hook forward priority 0;
	}

	chain output {
		type filter hook output priority 0;
	}
}

