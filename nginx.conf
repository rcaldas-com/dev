events {}

http {
    # DNS interno do Docker, com TTL curto. Sem isto o nginx resolve o nome
    # do upstream UMA vez, no start, e guarda o IP pra sempre -- qualquer
    # `docker compose up -d --force-recreate web` dá um IP novo ao container
    # e o nginx passa a devolver 502 apontando pro endereço morto, até
    # alguém reiniciar o nginx. O sintoma engana: o container está de pé e
    # respondendo, só não por esse caminho.
    #
    # Só ter o resolver não basta: o nginx só re-resolve quando o host do
    # proxy_pass vem de uma variável. Daí o `set $upstream_*` em cada bloco.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 64m;

        location / {
            set $upstream_web web;
            proxy_pass http://$upstream_web:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location /_next/webpack-hmr {
            set $upstream_web web;
            proxy_pass http://$upstream_web:3000/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /wallet {
            set $upstream_wallet wallet;
            proxy_pass http://$upstream_wallet:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location /wallet/_next/webpack-hmr {
            set $upstream_wallet wallet;
            proxy_pass http://$upstream_wallet:3000/wallet/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # car -- na 81 (publicada como 8009), a mesma porta que o stack antigo
    # do car-dev usava, pra nao mudar o endereco de quem ja desenvolve nele.
    server {
        listen 81;
        server_name localhost;
        client_max_body_size 128m;

        # O car sobe muitas imagens; os timeouts vieram do nginx.conf dele.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        location / {
            set $upstream_car car;
            proxy_pass http://$upstream_car:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location /_next/webpack-hmr {
            set $upstream_car car;
            proxy_pass http://$upstream_car:3000/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
